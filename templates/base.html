<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{page or 'Account'}} · Folio Campus</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><body><header><a class="brand" href="/"><b>▧</b> Folio<span>Campus</span></a>{% if user %}<nav aria-label="Main navigation">{% for link in ['Overview','Assignments','Timetable'] %}<a href="{{url_for('dashboard',view=link)}}" {% if page==link %}aria-current="page"{% endif %}>{{link}}</a>{% endfor %}</nav>{% if user.email %}<form method="post" action="/logout"><input type="hidden" name="token" value="{{session.token}}"><button class="link">Sign out</button></form>{% else %}<a href="/account/login">Sign in ↗</a>{% endif %}{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
