{% extends 'base.html' %}{% block content %}<div class="auth"><div class="eyebrow">Student account</div><h1>{{'Sign in' if mode=='login' else 'Register'}}<em>.</em></h1><form method="post"><input name="token" type="hidden" value="{{session.token}}">{% if error %}<p role="alert">{{error}}</p>{% endif %}{% if mode=='register' %}<label>Name<input required name="name" maxlength="60" autocomplete="given-name"></label>{% endif %}<label>Email<input required type="email" name="email" autocomplete="email"></label><label>Password<input required type="password" name="password" autocomplete="{{'current-password' if mode=='login' else 'new-password'}}" {% if mode=='register' %}minlength="8"{% endif %}></label><button class="action">{{'Sign in' if mode=='login' else 'Create account'}}</button></form><p><a href="/account/{{'register' if mode=='login' else 'login'}}">{{'Create an account' if mode=='login' else 'Already registered? Sign in'}}</a></p><a href="/">Return to study desk</a></div>{% endblock %}
